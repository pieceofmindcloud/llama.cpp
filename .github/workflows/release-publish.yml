name: Publish Release

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - master
      - pom

run-name: "Publish ${{ github.event.workflow_run.display_title }}"

cache-mode: none
permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}

jobs:
  publish:
    # POM: a partial release is published too. A platform whose job failed (or never
    # got a runner) only leaves its packages out; the others still ship.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}

    # Fine-grained permission
    # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
        actions: read
        contents: write # for creating release
        id-token: write
        attestations: write

    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.name }}

    steps:
      - id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if echo "$COMMIT_MESSAGE" | grep -q '\[no release\]'; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Clone
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_RELEASE }}

      - name: Determine tag name
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Download artifacts
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: download-artifact
        uses: actions/download-artifact@v8
        with:
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          skip-decompress: true

      - name: Merge artifacts
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: move_artifacts
        run: |
          mkdir -p release

          # the windows-cpu zip contains the full toolset (llama-server with the embedded
          # UI, ggml-cpu) - inject it into the other windows zips so that every archive
          # ships the same binaries, only with a different backend library on top
          echo "Injecting windows-cpu binaries (llama-server + CPU backend) into the backend zips..."
          for arch in x64; do
            cpu_zip="artifact/llama-bin-win-cpu-${arch}.zip"
            if [ ! -f "$cpu_zip" ]; then
              echo "::warning::no windows-cpu-${arch} package; the backend zips ship without it"
              continue
            fi
            temp_dir=$(mktemp -d)
            echo "Extracting windows-cpu-${arch} package..."
            unzip "$cpu_zip" -d "$temp_dir"

            echo "Merging into $arch zips..."
            for target_zip in artifact/llama-bin-win-*-${arch}.zip; do
              if [[ "$target_zip" == "$cpu_zip" ]]; then
                continue
              fi
              echo "Injecting into $(basename "$target_zip")"
              realpath_target_zip=$(realpath "$target_zip")
              (cd "$temp_dir" && zip -r "$realpath_target_zip" .)
            done

            rm -rf "$temp_dir"
          done

          # CUDA 13.5 + Vulkan in one package. The backends are loadable modules
          # (GGML_BACKEND_DL), so the CUDA package plus the Vulkan module is a
          # build with both: NVIDIA through CUDA, AMD/Intel through Vulkan.
          echo "Building the combined CUDA 13.5 + Vulkan packages..."
          combined_win="$(realpath artifact)/llama-bin-win-cuda-13.5-vulkan-x64.zip"
          if [ -f artifact/llama-bin-win-cuda-13.5-x64.zip ] && [ -f artifact/llama-bin-win-vulkan-x64.zip ]; then
            cp artifact/llama-bin-win-cuda-13.5-x64.zip "$combined_win"
            vk_dir=$(mktemp -d)
            unzip -j artifact/llama-bin-win-vulkan-x64.zip 'ggml-vulkan.dll' -d "$vk_dir"
            (cd "$vk_dir" && zip "$combined_win" ggml-vulkan.dll)
            rm -rf "$vk_dir"
          else
            echo "::warning::no Windows CUDA 13.5 or Vulkan package; no combined Windows package"
          fi

          tag="${{ steps.tag.outputs.name }}"
          cuda_tar="artifact/llama-${tag}-bin-ubuntu-cuda-13.5-x64.tar.gz"
          vk_tar="artifact/llama-${tag}-bin-ubuntu-vulkan-x64.tar.gz"
          if [ -f "$cuda_tar" ] && [ -f "$vk_tar" ]; then
            linux_dir=$(mktemp -d)
            tar -xzf "$cuda_tar" -C "$linux_dir"
            tar -xzf "$vk_tar" -C "$linux_dir" --wildcards '*/libggml-vulkan*'
            tar -czf "artifact/llama-${tag}-bin-ubuntu-cuda-13.5-vulkan-x64.tar.gz" -C "$linux_dir" "llama-${tag}"
            rm -rf "$linux_dir"
          else
            echo "::warning::no Linux CUDA 13.5 or Vulkan package; no combined Linux package"
          fi

          echo "Renaming and moving zips to release..."
          shopt -s nullglob
          for zip_file in artifact/llama-bin-win-*.zip; do
            base_name=$(basename "$zip_file" .zip)
            zip_name="llama-${{ steps.tag.outputs.name }}-${base_name#llama-}.zip"
            echo "Moving $zip_file to release/$zip_name"
            mv "$zip_file" "release/$zip_name"
          done

          echo "Moving other artifacts..."
          rm -f artifact/llama-ui.zip
          for f in artifact/*.zip artifact/*.tar.gz; do mv -v "$f" release; done
          ls release | grep -q . || { echo "::error::no package was built"; exit 1; }

      - name: Download UI build
        continue-on-error: true
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: download_ui
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: ./ui-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package UI
        continue-on-error: true
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: package_ui
        run: |
          tar -czvf release/llama-${{ steps.tag.outputs.name }}-ui.tar.gz --transform "s,^\.,llama-${{ steps.tag.outputs.name }}," -C ./ui-dist .

      - name: Attest release artifacts
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: 'release/*'

      - name: Create release
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: create_release
        uses: ggml-org/action-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          body: |
            <details open>

            ${{ github.event.workflow_run.head_commit.message }}

            </details>

            **Website:**
            - <https://llama.app>

            **Attestations:**
            - <${{ steps.attest.outputs.attestation-url }}>

            **macOS:**
            - [macOS Apple Silicon (arm64)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-macos-arm64.tar.gz)
            - [macOS Intel (x64)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-macos-x64.tar.gz)

            **Linux:**
            - [Ubuntu x64 (CPU)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-x64.tar.gz)
            - [Ubuntu x64 (Vulkan)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz)
            - [Ubuntu x64 (CUDA 13.5)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-13.5-x64.tar.gz) - [CUDA 13.5 libraries](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/cudart-llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-13.5-x64.tar.gz)
            - [Ubuntu x64 (CUDA 13.5 + Vulkan)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-13.5-vulkan-x64.tar.gz)

            **Windows:**
            - [Windows x64 (CPU)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-win-cpu-x64.zip)
            - [Windows x64 (Vulkan)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-win-vulkan-x64.zip)
            - [Windows x64 (CUDA 13.5)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-win-cuda-13.5-x64.zip) - [CUDA 13.5 DLLs](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/cudart-llama-bin-win-cuda-13.5-x64.zip)
            - [Windows x64 (CUDA 13.5 + Vulkan)](https://github.com/pieceofmindcloud/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-win-cuda-13.5-vulkan-x64.zip)

            **UI:**
            - [UI](https://github.com/ggml-org/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-ui.tar.gz)

      - name: Upload release
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: upload_release
        uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const path = require('path');
            const fs = require('fs');
            const release_id = '${{ steps.create_release.outputs.id }}';
            for (let file of await fs.readdirSync('./release')) {
              if (path.extname(file) === '.zip' || file.endsWith('.tar.gz')) {
                console.log('uploadReleaseAsset', file);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release_id,
                  name: file,
                  data: await fs.readFileSync(`./release/${file}`)
                });
              }
            }
